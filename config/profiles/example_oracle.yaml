id: example-grid
name: Example Grid Model
description: >
  Example only. Replace table names / columns / SQL with the target project's
  Oracle schema. Core FastAPI code does not need to change.
enabled: false

metadata:
  project: Example
  region: Any
  api_contract: "v1"

datasources:
  model:
    driver: oracle
    user: ${MODEL_ORACLE_USER}
    password: ${MODEL_ORACLE_PASSWORD}
    dsn: ${MODEL_ORACLE_DSN}
    pool:
      min: 1
      max: 6
      increment: 1
      timeout: 60

  realtime:
    driver: oracle
    user: ${RT_ORACLE_USER:-readonly_user}
    password: ${RT_ORACLE_PASSWORD:-change_me}
    dsn: ${RT_ORACLE_DSN:-127.0.0.1:1521/RTDB}
    pool:
      min: 1
      max: 4
      increment: 1
      timeout: 60

hierarchy:
  root_query: tree_root
  children_queries:
    region: tree_children_region
    station: tree_children_station
    feeder: tree_children_feeder
    equipment: tree_children_equipment

entities:
  station:
    detail_query: detail_station
    children_query: tree_children_station
    topology_query: topology_station

  feeder:
    detail_query: detail_feeder
    children_query: tree_children_feeder
    topology_query: topology_feeder

  equipment:
    detail_query: detail_equipment
    children_query: tree_children_equipment
    signals_query: equipment_signals
    path_query: equipment_path
    upstream_query: equipment_upstream
    downstream_query: equipment_downstream

  signal:
    detail_query: detail_signal

search:
  query: search
  default_limit: 50
  max_limit: 200

realtime:
  enabled: false
  signal_query: realtime_signal
  batch_query: realtime_batch
  max_batch_size: 1000

queries:
  tree_root:
    source: model
    result: many
    cache_ttl_seconds: 300
    allowed_params: []
    required_params: []
    sql: |
      SELECT
          TO_CHAR(r.region_id) AS id,
          r.region_name AS name,
          'region' AS type,
          1 AS has_children
      FROM grid_region r
      ORDER BY r.region_name

  tree_children_region:
    source: model
    result: many
    cache_ttl_seconds: 300
    allowed_params: [node_id]
    required_params: [node_id]
    sql: |
      SELECT
          TO_CHAR(s.station_id) AS id,
          s.station_name AS name,
          'station' AS type,
          1 AS has_children
      FROM grid_station s
      WHERE TO_CHAR(s.region_id) = :node_id
      ORDER BY s.station_name

  tree_children_station:
    source: model
    result: many
    cache_ttl_seconds: 120
    allowed_params: [node_id, entity_id]
    required_params: []
    sql: |
      SELECT
          TO_CHAR(f.feeder_id) AS id,
          f.feeder_name AS name,
          'feeder' AS type,
          1 AS has_children
      FROM grid_feeder f
      WHERE TO_CHAR(f.station_id) = NVL(:node_id, :entity_id)
      ORDER BY f.feeder_name

  tree_children_feeder:
    source: model
    result: many
    cache_ttl_seconds: 60
    allowed_params: [node_id, entity_id]
    required_params: []
    sql: |
      SELECT
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          'equipment' AS type,
          e.equipment_type AS subtype,
          1 AS has_children
      FROM grid_equipment e
      WHERE TO_CHAR(e.feeder_id) = NVL(:node_id, :entity_id)
        AND e.parent_id IS NULL
      ORDER BY e.equipment_name

  tree_children_equipment:
    source: model
    result: many
    cache_ttl_seconds: 30
    allowed_params: [node_id, entity_id]
    required_params: []
    sql: |
      SELECT
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          'equipment' AS type,
          e.equipment_type AS subtype,
          CASE
            WHEN EXISTS (
              SELECT 1
              FROM grid_equipment c
              WHERE c.parent_id = e.equipment_id
            ) THEN 1 ELSE 0
          END AS has_children
      FROM grid_equipment e
      WHERE TO_CHAR(e.parent_id) = NVL(:node_id, :entity_id)
      ORDER BY e.equipment_name

  detail_station:
    source: model
    result: one
    cache_ttl_seconds: 120
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          TO_CHAR(s.station_id) AS id,
          s.station_name AS name,
          s.station_code AS code,
          s.voltage_level AS voltage_level
      FROM grid_station s
      WHERE TO_CHAR(s.station_id) = :entity_id

  detail_feeder:
    source: model
    result: one
    cache_ttl_seconds: 120
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          TO_CHAR(f.feeder_id) AS id,
          f.feeder_name AS name,
          TO_CHAR(f.station_id) AS station_id,
          f.voltage_level AS voltage_level
      FROM grid_feeder f
      WHERE TO_CHAR(f.feeder_id) = :entity_id

  detail_equipment:
    source: model
    result: one
    cache_ttl_seconds: 30
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          e.equipment_type AS type,
          TO_CHAR(e.parent_id) AS parent_id,
          TO_CHAR(e.feeder_id) AS feeder_id,
          e.facility_id AS facid,
          e.voltage_level AS voltage_level
      FROM grid_equipment e
      WHERE TO_CHAR(e.equipment_id) = :entity_id

  equipment_signals:
    source: model
    result: many
    cache_ttl_seconds: 30
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          TO_CHAR(s.signal_id) AS id,
          s.signal_name AS name,
          s.signal_type AS type,
          TO_CHAR(s.point_id) AS point_id,
          s.ioa AS ioa,
          s.unit AS unit
      FROM grid_signal s
      WHERE TO_CHAR(s.equipment_id) = :entity_id
      ORDER BY s.signal_type, s.signal_name

  detail_signal:
    source: model
    result: one
    cache_ttl_seconds: 30
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          TO_CHAR(s.signal_id) AS id,
          s.signal_name AS name,
          s.signal_type AS type,
          TO_CHAR(s.point_id) AS point_id,
          s.ioa AS ioa,
          s.unit AS unit,
          TO_CHAR(s.equipment_id) AS equipment_id
      FROM grid_signal s
      WHERE TO_CHAR(s.signal_id) = :entity_id

  equipment_path:
    source: model
    result: many
    cache_ttl_seconds: 30
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          LEVEL AS depth,
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          e.equipment_type AS type
      FROM grid_equipment e
      START WITH TO_CHAR(e.equipment_id) = :entity_id
      CONNECT BY PRIOR e.parent_id = e.equipment_id
      ORDER BY depth DESC

  equipment_upstream:
    source: model
    result: many
    cache_ttl_seconds: 10
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          LEVEL AS depth,
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          e.equipment_type AS type
      FROM grid_equipment e
      START WITH TO_CHAR(e.equipment_id) = :entity_id
      CONNECT BY PRIOR e.parent_id = e.equipment_id

  equipment_downstream:
    source: model
    result: many
    cache_ttl_seconds: 10
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          LEVEL AS depth,
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS name,
          e.equipment_type AS type
      FROM grid_equipment e
      START WITH TO_CHAR(e.equipment_id) = :entity_id
      CONNECT BY PRIOR e.equipment_id = e.parent_id

  topology_station:
    source: model
    result: many
    cache_ttl_seconds: 60
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          'node' AS record_type,
          TO_CHAR(f.feeder_id) AS id,
          f.feeder_name AS label,
          'feeder' AS node_type,
          CAST(NULL AS VARCHAR2(100)) AS source_id,
          CAST(NULL AS VARCHAR2(100)) AS target_id
      FROM grid_feeder f
      WHERE TO_CHAR(f.station_id) = :entity_id

  topology_feeder:
    source: model
    result: many
    cache_ttl_seconds: 30
    allowed_params: [entity_id]
    required_params: [entity_id]
    sql: |
      SELECT
          'node' AS record_type,
          TO_CHAR(e.equipment_id) AS id,
          e.equipment_name AS label,
          e.equipment_type AS node_type,
          CAST(NULL AS VARCHAR2(100)) AS source_id,
          CAST(NULL AS VARCHAR2(100)) AS target_id
      FROM grid_equipment e
      WHERE TO_CHAR(e.feeder_id) = :entity_id

      UNION ALL

      SELECT
          'edge' AS record_type,
          TO_CHAR(c.equipment_id) || '-' || TO_CHAR(c.parent_id) AS id,
          CAST(NULL AS VARCHAR2(200)) AS label,
          'connection' AS node_type,
          TO_CHAR(c.parent_id) AS source_id,
          TO_CHAR(c.equipment_id) AS target_id
      FROM grid_equipment c
      WHERE TO_CHAR(c.feeder_id) = :entity_id
        AND c.parent_id IS NOT NULL

  search:
    source: model
    result: many
    cache_ttl_seconds: 10
    allowed_params: [q_like, limit, entity_type]
    required_params: [q_like, limit]
    sql: |
      SELECT *
      FROM (
        SELECT
            TO_CHAR(e.equipment_id) AS id,
            e.equipment_name AS name,
            'equipment' AS type,
            e.equipment_type AS subtype
        FROM grid_equipment e
        WHERE UPPER(e.equipment_name) LIKE :q_like
          AND (:entity_type IS NULL OR :entity_type = 'equipment')

        UNION ALL

        SELECT
            TO_CHAR(s.signal_id) AS id,
            s.signal_name AS name,
            'signal' AS type,
            s.signal_type AS subtype
        FROM grid_signal s
        WHERE (
              UPPER(s.signal_name) LIKE :q_like
              OR TO_CHAR(s.ioa) LIKE :q_like
        )
          AND (:entity_type IS NULL OR :entity_type = 'signal')
      )
      WHERE ROWNUM <= :limit

  realtime_signal:
    source: realtime
    result: one
    cache_ttl_seconds: 0
    allowed_params: [signal_id]
    required_params: [signal_id]
    sql: |
      SELECT
          TO_CHAR(r.signal_id) AS signal_id,
          r.value AS value,
          r.quality AS quality,
          r.update_time AS timestamp
      FROM realtime_value r
      WHERE TO_CHAR(r.signal_id) = :signal_id

  realtime_batch:
    source: realtime
    result: many
    cache_ttl_seconds: 0
    allowed_params: [point_ids_csv]
    required_params: [point_ids_csv]
    sql: |
      SELECT
          TO_CHAR(r.point_id) AS point_id,
          r.value AS value,
          r.quality AS quality,
          r.update_time AS timestamp
      FROM realtime_value r
      WHERE INSTR(',' || :point_ids_csv || ',', ',' || TO_CHAR(r.point_id) || ',') > 0

  example_custom_named_query:
    source: model
    result: many
    cache_ttl_seconds: 30
    exposed: true
    allowed_params: [station_id]
    required_params: [station_id]
    sql: |
      SELECT
          TO_CHAR(f.feeder_id) AS id,
          f.feeder_name AS name
      FROM grid_feeder f
      WHERE TO_CHAR(f.station_id) = :station_id
      ORDER BY f.feeder_name
